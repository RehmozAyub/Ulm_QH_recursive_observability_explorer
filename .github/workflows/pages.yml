name: Deploy simulator to GitHub Pages

# Publishes web_html_version/ as the project website, so the simulator is
# reachable at
#   https://rehmozayub.github.io/Ulm_QH_recursive_observability_explorer/
#
# One-time setup, in the repository on github.com:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# After that this workflow runs on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the simulator directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_html_version

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
